[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Package metadata
# ---------------------------------------------------------------------------
[project]
name = "chord"
version = "0.1.0"
description = "A Discord bot powered by any OpenAI-compatible LLM, with pluggable skills and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "chord developers" }]
keywords = ["discord", "bot", "llm", "openai", "mcp", "skills"]

dependencies = [
    # Discord gateway/API client.
    "discord.py>=2.4",
    # Official OpenAI SDK. Works with any OpenAI-compatible server via base_url.
    "openai>=1.40",
    # Typed settings loaded from environment variables / .env files.
    "pydantic-settings>=2.3",
    # Async HTTP client used by the built-in data skills.
    "httpx>=0.27",
    # Model Context Protocol client SDK (external tool servers).
    "mcp>=1.2",
    # Chart rendering for the price-history skill. Pillow rather than
    # matplotlib: one polyline does not justify numpy, and an explicit
    # font path is what keeps Korean labels from turning into boxes.
    # 10.1 is the floor because load_default() only takes a size there.
    "pillow>=10.1",
    # IANA timezone database for Windows (zoneinfo falls back to it).
    "tzdata>=2024.1",
    # Non-deprecated audioop replacement (discord.py imports it for voice;
    # required on Python 3.13+ where stdlib audioop is removed).
    'audioop-lts>=0.1.0; python_version >= "3.13"',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # HTTP mocking so skill tests never touch the real network.
    "respx>=0.21",
    # Linting + formatting.
    "ruff>=0.5",
]

# Console entry point so the bot can be started with `chord` after install.
[project.scripts]
chord = "chord.__main__:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
]
ignore = [
    "E501", # long lines are handled by the formatter where possible
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    # discord.py unconditionally imports audioop (deprecated in 3.11+,
    # removed in 3.13) at import time for voice support. We don't use
    # voice, and the fix is upstream. audioop-lts handles 3.13+.
    "ignore::DeprecationWarning:discord.player",
]
